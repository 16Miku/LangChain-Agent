[project]
name = "my-chat-langchain"
version = "10.0.0"
description = "Stream-Agent - 全栈 AI 研究助理应用"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Anonymous"}
]
keywords = ["langchain", "langgraph", "ai", "chatbot", "rag"]

dependencies = [
    # === Web Framework ===
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "python-multipart>=0.0.20",
    "sse-starlette>=3.0.0",

    # === Data Validation ===
    "pydantic>=2.11.0",
    "pydantic-settings>=2.12.0",

    # === Database ===
    "sqlalchemy>=2.0.45",
    "aiosqlite>=0.21.0",
    "psycopg2-binary>=2.9.11",
    "alembic>=1.17.0",

    # === Authentication ===
    "bcrypt>=5.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib>=1.7.4",

    # === LangChain Ecosystem ===
    "langchain>=0.3.27",
    "langchain-community>=0.3.29",
    "langchain-core>=0.3.76",
    "langchain-google-genai>=2.1.9",
    "langchain-openai>=0.3.33",
    "langchain-huggingface>=0.3.1",
    "langchain-chroma>=0.2.5",
    "langchain-text-splitters>=0.3.11",
    "langchain-mcp-adapters>=0.1.11",

    # === LangGraph ===
    "langgraph>=0.6.6",
    "langgraph-checkpoint>=2.1.0",
    "langgraph-checkpoint-sqlite>=2.0.10",
    "langsmith>=0.3.45",

    # === Google AI ===
    "google-generativeai>=0.8.6",
    "google-genai>=1.60.0",

    # === OpenAI ===
    "openai>=1.109.0",
    "tiktoken>=0.12.0",

    # === Vector Store & Embedding ===
    "chromadb>=1.0.20",
    "pymilvus>=2.6.6",
    "sentence-transformers>=5.1.1",
    "flashrank>=0.2.10",

    # === ML/DL Core ===
    "torch>=2.9.0",
    "transformers>=4.57.0",

    # === Scientific Computing ===
    "numpy>=2.3.0",
    "scipy>=1.16.0",
    "pandas>=2.3.0",
    "scikit-learn>=1.8.0",

    # === NLP ===
    "jieba>=0.42.1",

    # === PDF Processing ===
    "pypdf>=5.8.0",
    "pypdf2>=3.0.1",

    # === PPTX Generation ===
    "python-pptx>=1.0.2",
    "pillow>=11.3.0",

    # === Speech (Whisper) ===
    "faster-whisper>=1.2.1",
    "edge-tts>=7.2.7",

    # === MCP ===
    "mcp>=1.13.1",
    "fastapi-mcp>=0.4.0",

    # === E2B (Code Sandbox) ===
    "e2b>=2.8.1",
    "e2b-code-interpreter>=2.4.1",

    # === HTTP Clients ===
    "httpx>=0.28.1",
    "requests>=2.32.5",

    # === Playwright ===
    "playwright>=1.57.0",

    # === Web Scraping ===
    "beautifulsoup4>=4.13.4",
    "lxml>=6.0.2",

    # === Utilities ===
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.3",
    "rich>=14.2.0",
    "tqdm>=4.67.1",

    # === Testing ===
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[project.optional-dependencies]
# Streamlit 旧前端 (可选)
streamlit = [
    "streamlit>=1.46.1",
    "altair>=5.5.0",
]

# 开发依赖
dev = [
    "ruff>=0.4.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
]

[tool.uv]
# 包索引
index-url = "https://pypi.org/simple"

[tool.uv.pip]
# pip 配置
index-url = "https://pypi.org/simple"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "backend/*/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
